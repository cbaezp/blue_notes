[project]
name = "blue-notes"
version = "0.1.0"
description = "Blue Notes backend service for team note-taking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.0,<5.3.0",
    "djangorestframework>=3.15.2",
    "psycopg[binary]>=3.2.1",
    "django-environ>=0.11.2",
    "django-cors-headers>=4.4.0",
    "drf-spectacular>=0.28.0",
    "django-filter>=24.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-django>=4.9.0",
    "ruff>=0.6.0",
    "factory-boy>=3.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C4",     # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "DJ",     # flake8-django
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
]
ignore = [
    "DJ008",  # Model does not define __str__
    "E501",   # Line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
